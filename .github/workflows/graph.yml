name: Generate Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Graph SVG
        run: |
          echo '<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="#0d1117"/>
          <polyline fill="none" stroke="#00f7ff" stroke-width="3"
          points="0,180 50,180 100,180 150,180 200,180 250,170 300,180 350,50 400,180"/>
          </svg>' > graph.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
