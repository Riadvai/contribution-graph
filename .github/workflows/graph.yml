name: Generate Graph

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Create graph.svg
        run: |
          echo '<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="#0d1117"/>
          <polyline fill="none" stroke="#00f7ff" stroke-width="3"
          points="0,180 50,180 100,180 150,180 200,180 250,170 300,180 350,50 400,180"/>
          </svg>' > graph.svg

      - name: Push to output branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git checkout -b output || git checkout output
          cp graph.svg .

          git add graph.svg
          git commit -m "update graph" || echo "no changes"
          git push origin output --force
