<!DOCTYPE html>
<html>
<head>
  <title>Contribution Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #0d1117;
      color: #00f7ff;
      text-align: center;
      font-family: Arial;
    }
    canvas {
      max-width: 1000px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<h2>My Real Contribution Graph</h2>
<canvas id="chart"></canvas>

<script>
async function loadData() {
  const res = await fetch("https://github-contributions-api.jogruber.de/v4/riadvai");
  const data = await res.json();

  let counts = [];

  data.contributions.forEach(week => {
    week.days.forEach(day => {
      counts.push(day.count);
    });
  });

  return counts.slice(-30); // last 30 days
}

loadData().then(values => {
  const ctx = document.getElementById('chart');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array.from({length: values.length}, (_, i) => i+1),
      datasets: [{
        label: 'Contributions',
        data: values,
        borderColor: '#00f7ff',
        backgroundColor: 'rgba(0,247,255,0.2)',
        tension: 0.4,
        pointRadius: 4
      }]
    },
    options: {
      animation: {
        duration: 2000
      },
      plugins: {
        legend: {
          labels: { color: '#00f7ff' }
        }
      },
      scales: {
        x: {
          ticks: { color: '#00f7ff' },
          grid: { color: '#1f2a38' }
        },
        y: {
          ticks: { color: '#00f7ff' },
          grid: { color: '#1f2a38' }
        }
      }
    }
  });
});
</script>

</body>
</html>
